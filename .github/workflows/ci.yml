name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (prettier + eslint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run lint` is defined in package.json as
      # `prettier --check . && eslint .`
      - name: Lint
        run: npm run lint

  unit-tests:
    name: unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` is defined in package.json as `vitest run`.
      - name: Vitest
        run: npm test

  drift-arch-guard:
    # Blocking gate per Phase 4 step 1. Today this runs a stub that exits 0;
    # the job is wired here so the moment real drift / architecture checks
    # land in scripts/drift-arch-guard.sh, the gate is already in place.
    name: drift / arch guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run drift / arch guard
        run: bash scripts/drift-arch-guard.sh
