name: CI — Gate Ladder

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: Lint (BLOCKING) ────────────────────────────────────────────
  lint:
    name: "Gate 1 · Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: Ruff check (changed files only)
        run: |
          FILES=$(git diff --name-only --diff-filter=ACM origin/main...HEAD -- '*.py' | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            echo "Linting: $FILES"
            ruff check $FILES
          else
            echo "No changed Python files — skipping ruff check."
          fi
      - name: Ruff format check (changed files only)
        run: |
          FILES=$(git diff --name-only --diff-filter=ACM origin/main...HEAD -- '*.py' | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            echo "Formatting: $FILES"
            ruff format --check $FILES
          else
            echo "No changed Python files — skipping format check."
          fi
      - name: Sync gate status
        if: always() && github.event_name == 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          STATUS=${{ job.status == 'success' && 'success' || 'failure' }}
          python scripts/ci_gate_sync.py gate \
            --gate-name lint \
            --status "$STATUS" \
            --pr-number ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ── Gate 2: Tests (BLOCKING) ───────────────────────────────────────────
  tests:
    name: "Gate 2 · Tests"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -v --tb=short --cov --cov-report=json
      - name: Sync coverage
        if: always() && github.event_name == 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/ci_coverage_sync.py \
            --repo ${{ github.repository }} \
            --pr-number ${{ github.event.pull_request.number }} \
            --commit-sha ${{ github.sha }} \
            --coverage-json coverage.json
      - name: Sync gate status
        if: always() && github.event_name == 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          STATUS=${{ job.status == 'success' && 'success' || 'failure' }}
          python scripts/ci_gate_sync.py gate \
            --gate-name tests \
            --status "$STATUS" \
            --pr-number ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ── Gate 3: CodeRabbit Review (BLOCKING if CHANGES_REQUESTED) ───────────
  coderabbit-check:
    name: 'Gate 3 · CodeRabbit'
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1 pinned
        with:
          script: |
            // Debug: dump available context info
            const sha = context.sha;
            const prNum = context.issue.number;
            console.log(`PR=${prNum}, sha=${sha}`);
            // 1. Check reviews
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNum,
            });
            const cr = [...reviews].reverse().find(r => r.user?.login === 'coderabbitai');
            if (cr) {
              if (cr.state === 'CHANGES_REQUESTED') {
                core.setFailed('CodeRabbit has CHANGES_REQUESTED — fix before merge.');
              }
              console.log('CodeRabbit state:', cr.state);
              return;
            }
            // 2. Check check runs via checks API for all possible refs
            const refs = [sha, 'refs/pull/' + prNum + '/merge', 'refs/pull/' + prNum + '/head'];
            let crCheck = null;
            for (const ref of refs) {
              try {
                const { data: c } = await github.rest.checks.listForRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref,
                });
                console.log(`checks at ${ref}: ${c.check_runs?.length ?? 0} runs`);
                for (const run of (c.check_runs ?? [])) {
                  console.log(`  run: name="${run.name}", app="${run.app?.slug}", status=${run.status}, conclusion=${run.conclusion}`);
                }
                const found = c.check_runs?.find(x => x.name === 'CodeRabbit' || x.app?.slug === 'coderabbitai');
                if (found) { crCheck = found; break; }
              } catch (e) {
                console.log(`checks(${ref}) error: ${e.message}`);
              }
            }
            if (crCheck) {
              console.log(`CR found: status=${crCheck.status}, conclusion=${crCheck.conclusion}`);
              if (crCheck.status === 'completed' && crCheck.conclusion === 'success') {
                console.log('CodeRabbit check passed — allow.');
              } else {
                core.setFailed(`CodeRabbit check not passed: status=${crCheck.status}, conclusion=${crCheck.conclusion}`);
              }
              return;
            }
            // 3. Try combined status
            for (const ref of [sha, 'refs/pull/' + prNum + '/merge']) {
              try {
                const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref,
                });
                const s = combined.statuses.find(x => x.context === 'CodeRabbit');
                if (s) { console.log(`CR status at ${ref}: state=${s.state}`); crCheck = s; break; }
              } catch (e) { /* skip */ }
            }
            if (crCheck?.state === 'success') {
              console.log('CodeRabbit status passed — allow.');
            } else {
              // 4. Try check suites
              for (const ref of [sha, 'refs/pull/' + prNum + '/head']) {
                try {
                  const { data: suites } = await github.rest.checks.listSuitesForRef({
                    owner: context.repo.owner, repo: context.repo.repo, ref,
                  });
                  console.log(`suites at ${ref}: ${suites.check_suites?.length ?? 0} suites`);
                  for (const s of (suites.check_suites ?? [])) {
                    const ls = await github.rest.checks.listForSuite({
                      owner: context.repo.owner, repo: context.repo.repo,
                      check_suite_id: s.id,
                    });
                    const sr = ls.check_runs?.find(x => x.name === 'CodeRabbit' || x.app?.slug === 'coderabbitai');
                    if (sr) { console.log(`CR from suite ${s.id}: status=${sr.status}, conclusion=${sr.conclusion}`); crCheck = sr; break; }
                  }
                  if (crCheck) break;
                } catch (e) { console.log(`suites(${ref}) error: ${e.message}`); }
              }
              if (crCheck?.status === 'completed' && crCheck?.conclusion === 'success') {
                console.log('CodeRabbit check passed (from suite) — allow.');
              } else if (crCheck) {
                core.setFailed(`CodeRabbit check not passed: status=${crCheck.status}, conclusion=${crCheck.conclusion}`);
              } else {
                core.setFailed('No CodeRabbit review found via any API.');
              }
            }

  # ── Gate 4: Drift / Arch Guard (BLOCKING) ──────────────────────────────
  drift-guard:
    name: "Gate 4 · Drift Guard"
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Validate /state contract (15 fields)
        run: python scripts/ci_state_guard.py
      - name: Drift / arch guard
        run: bash scripts/drift_arch_guard.sh
      - name: Sync gate status
        if: always() && github.event_name == 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          STATUS=${{ job.status == 'success' && 'success' || 'failure' }}
          python scripts/ci_gate_sync.py gate \
            --gate-name drift_guard \
            --status "$STATUS" \
            --pr-number ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ── Gate 5: Merge Ready (aggregate gate) ────────────────────────────────
  merge-ready:
    name: 'Gate 5 · Merge Ready'
    runs-on: ubuntu-latest
    needs: [lint, tests, coderabbit-check, drift-guard]
    steps:
      - run: echo "✅ All gates passed — ready for merge."

  # ── Post-merge: task_activity sync ─────────────────────────────────────
  merge-sync:
    name: "Sync · merge activity"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Post merge activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PR_NUM=$(echo "$HEAD_COMMIT_MESSAGE" | grep -oP '#\K\d+' | head -1)
          python scripts/ci_gate_sync.py merge \
            --pr-number "${PR_NUM:-0}" \
            --repo ${{ github.repository }} \
            --detail "$HEAD_COMMIT_MESSAGE"
