name: CI — Gate Ladder

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: Lint (BLOCKING) ────────────────────────────────────────────
  lint:
    name: 'Gate 1 · Lint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint (changed files only)
        run: |
          if git diff --quiet --diff-filter=ACM origin/main...HEAD -- '*.ts' '*.svelte' '*.js'; then
            echo "No changed TS/Svelte/JS files — skipping ESLint."
          else
            echo "Linting changed files..."
            git diff -z --name-only --diff-filter=ACM origin/main...HEAD -- '*.ts' '*.svelte' '*.js' | xargs -0 npx eslint
          fi
      - name: Prettier check (changed files only)
        run: |
          if git diff --quiet --diff-filter=ACM origin/main...HEAD -- '*.ts' '*.svelte' '*.js' '*.css' '*.json' '*.mjs' '*.yml'; then
            echo "No changed formattable files — skipping Prettier."
          else
            echo "Checking formatting of changed files..."
            git diff -z --name-only --diff-filter=ACM origin/main...HEAD -- '*.ts' '*.svelte' '*.js' '*.css' '*.json' '*.mjs' '*.yml' | xargs -0 npx prettier --check
          fi

  # ── Gate 2: Tests + Type Check (BLOCKING) ──────────────────────────────
  tests:
    name: 'Gate 2 · Tests'
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npx vitest run
      - name: Svelte Check
        env:
          PUBLIC_HELIOS_API_URL: https://localhost:8080
          PUBLIC_HELIOS_WS_URL: wss://localhost:8080
          PUBLIC_USE_LIVE_BRIDGE: 'false'
          PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: placeholder-key
        run: npx svelte-kit sync && npx svelte-check --tsconfig ./tsconfig.json --threshold error

  # ── Gate 3: CodeRabbit Review (BLOCKING) ────────────────────────────────
  coderabbit-check:
    name: 'Gate 3 · CodeRabbit'
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const crReview = reviews.find(r => r.user?.login === 'coderabbitai' && r.state === 'CHANGES_REQUESTED');
            if (crReview) {
              core.setFailed(`CodeRabbit has CHANGES_REQUESTED — address comments before merge.`);
            }
            const crApproved = reviews.find(r => r.user?.login === 'coderabbitai' && r.state === 'APPROVED');
            if (crApproved) {
              console.log('CodeRabbit review approved.');
            }

  # ── Gate 4: Drift / Arch Guard (BLOCKING) ──────────────────────────────
  drift-guard:
    name: 'Gate 4 · Drift Guard'
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate /state contract (frontend ↔ backend)
        run: node scripts/ci_state_guard.mjs

  # ── Gate 5: Merge Ready (AGGREGATE) ─────────────────────────────────────
  merge-ready:
    name: 'Gate 5 · Merge Ready'
    runs-on: ubuntu-latest
    needs: [lint, tests, coderabbit-check, drift-guard]
    if: success()
    steps:
      - run: echo "✅ All gates passed — ready for Navpreet's merge."
